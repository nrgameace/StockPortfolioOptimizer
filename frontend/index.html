<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Portfolio Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen py-8">
    <div class="container mx-auto max-w-4xl px-4">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                📈 Portfolio Optimizer
            </h1>
            <p class="text-gray-600">
                ML-powered portfolio optimization using Random Forest predictions
                and mean-variance optimization
                <br>
                <br>
            <p class="text-gray-600">
                Stock Symbols Currently Supported: AAPL, MSFT, NVDA, AMZN, JNJ, JPM, XOM, CAT, PG, NEE
            </p>
            </p>
        </div>
        <div class="shadow-lg bg-white ">
            <h2 class="font-bold text-2xl">Input Data</h2>
            <form>
                <div class="p-4">
                    <label for="tickers" class="block text-gray-700 font-semibold mb-2">Enter Three or More Stock
                        Tickers (comma-separated):</label>
                    <input type="text" id="tickers" name="tickers"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., AAPL, MSFT, GOOGL">
                </div>
                <div class="p-4">
                    <label for="budget" class="block text-gray-700 font-semibold mb-2">Total Budget ($):</label>
                    <input type="number" id="budget" name="budget"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., 10000">
                </div>

                <div class="p-4">
                    <button type="submit"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        id="submit">
                        Optimize Portfolio
                    </button>
                </div>

            </form>

        </div>
        <div class="mt-6 shadow-lg bg-white p-4">
            <h2 class="font-bold text-2xl mb-4">Optimized Portfolio</h2>
            <p class="mb-4" id="output">Here is the optimized portfolio based on your input data:</p>
            <canvas id="portfolioChart" class="w-full h-64"></canvas>

        </div>
    </div>
    </head>
    <script src="script.js"></script>

    <body>

    </body>

</html>
